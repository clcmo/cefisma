name: Publish homepage mockup to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble homepage preview
        run: |
          mkdir -p _site/assets/css _site/assets/js _site/assets/images
          cp preview/index.html _site/index.html
          cp assets/css/main.css _site/assets/css/main.css
          cp assets/js/main.js _site/assets/js/main.js
          cp assets/images/estampa-cefisma.svg _site/assets/images/estampa-cefisma.svg
          cp print-cefisma.svg _site/print-cefisma.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4